services:
  floto:
    container_name: floto_web
    image: floto-dev:latest
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${FLOTO_PORT}"]
      timeout: 10s
      retries: 3
    env_file:
      - .env
    volumes:
      - .:/project
      - ./media:/media
      - ./config:/config
      - static:/static
    ports:
      - "127.0.0.1:8080:${FLOTO_PORT}"
    entrypoint: ["python3", "manage.py"]
    command: ["runserver", "0.0.0.0:${FLOTO_PORT}"]
    depends_on:
      - db
    build:
      dockerfile: Dockerfile
    networks:
      - k3d-floto-dev

  db:
    container_name: floto_db
    image: mariadb:${DB_IMG_TAG}
    restart: on-failure
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./db:/docker-entrypoint-initdb.d
      - ./data:/var/lib/mysql
    networks:
      - k3d-floto-dev

  redis: # Used for celery tasks
    image: redis:alpine
    networks:
      - k3d-floto-dev

  celery:
    container_name: floto_tasks
    image: floto-dev:latest
    restart: on-failure
    entrypoint: ["celery"]
    command:
      ["-A", "floto", "worker", "-l", "INFO", "--concurrency=1", "-B"]
    env_file:
      - .env
    volumes:
      - .:/project
      - ./config:/config
    depends_on:
      - db
      - redis
    networks:
      - k3d-floto-dev


volumes:
  static:

networks:
  k3d-floto-dev:
    external: true